# This file tells GitHub: "on a schedule, spin up a temporary Linux
# machine, run these commands, and save whatever changed back to the
# repo." It's how the tracker keeps running even when your laptop is
# off — GitHub's own servers do the work.
#
# Runs every 3 hours (8 times/day) rather than once, so analyze.py has
# multiple intraday samples to average into a true daily figure,
# instead of treating one snapshot as "today's AQI".

name: Update AQI Dashboard

on:
  schedule:
    # Cron syntax: minute hour day month weekday, always in UTC.
    # "0 */3 * * *" = every 3 hours, on the hour, every day:
    # 00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC
    # = 5:30am, 8:30am, 11:30am, 2:30pm, 5:30pm, 8:30pm, 11:30pm, 2:30am IST
    - cron: "0 */3 * * *"
  # Lets you trigger it by hand from the Actions tab, without waiting
  # for the schedule — useful for testing.
  workflow_dispatch:

# Needed so the workflow is allowed to commit the updated database
# and dashboard back into the repo.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch today's reading
        env:
          AQI_TOKEN: ${{ secrets.AQI_TOKEN }}
          CITY: ${{ vars.CITY }}
        run: python fetch_aqi.py

      - name: Analyze
        env:
          CITY: ${{ vars.CITY }}
        run: python analyze.py

      - name: Rebuild dashboard
        env:
          CITY: ${{ vars.CITY }}
        run: python generate_dashboard.py

      - name: Commit updated data and dashboard
        run: |
          git config user.name "aqi-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/aqi.db data/summary.json docs/index.html
          git diff --staged --quiet || git commit -m "Daily AQI update: $(date -u +'%Y-%m-%d')"
          git push
